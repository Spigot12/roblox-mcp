[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roblox-mcp"
version = "0.1.0"
description = "MCP server for Roblox Studio — lets Claude write scripts, place parts, and control Studio directly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Spigot12" }]
keywords = ["roblox", "mcp", "claude", "ai", "studio", "lua"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
roblox-mcp = "roblox_mcp:main"

[project.urls]
Homepage = "https://github.com/Spigot12/roblox-mcp"
Repository = "https://github.com/Spigot12/roblox-mcp"
Issues = "https://github.com/Spigot12/roblox-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/roblox_mcp"]
